<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Chain of Custody PDSU</title>
    <style>
      /* Reset & Font Setup */
      body {
        margin: 0;
        padding: 0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        /* Background Industrial Dark Blue Gradient */
        background: linear-gradient(135deg, #0d6efd 0%, #0f172a 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #333;
      }

      /* Kotak Login Modern */
      .login-wrapper {
        background: #ffffff;
        width: 100%;
        max-width: 380px;
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        padding: 40px 30px;
        box-sizing: border-box;
        margin: 20px;
      }

      /* Area Logo dan Judul */
      .brand-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .brand-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        background-color: #eff6ff;
        border-radius: 12px;
        color: #2563eb;
        margin-bottom: 15px;
      }

      .brand-title {
        font-size: 22px;
        font-weight: 700;
        color: #1e293b;
        margin: 0 0 5px 0;
      }

      .brand-subtitle {
        font-size: 14px;
        color: #64748b;
        margin: 0;
      }

      /* Notifikasi Error */
      .error-message {
        background-color: #fef2f2;
        border-left: 4px solid #ef4444;
        color: #991b1b;
        padding: 12px 15px;
        margin-bottom: 25px;
        font-size: 13px;
        border-radius: 4px;
        line-height: 1.5;
      }

      /* Styling Form Input */
      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 8px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-icon-left {
        position: absolute;
        left: 14px;
        color: #94a3b8;
        display: flex;
      }

      .form-control {
        width: 100%;
        padding: 12px 15px 12px 42px; /* Padding kiri lebih besar untuk ikon */
        font-size: 14px;
        color: #1e293b;
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-sizing: border-box;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        background-color: #ffffff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        outline: none;
      }

      /* Ikon Mata (Toggle Password) */
      .input-icon-right {
        position: absolute;
        right: 14px;
        color: #94a3b8;
        cursor: pointer;
        display: flex;
        padding: 5px; /* Memperluas area tap di HP */
        /* Mencegah highlight biru saat ditahan di HP */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        transition: color 0.2s;
      }

      .input-icon-right:hover {
        color: #1e293b;
      }

      /* Tombol Submit */
      .btn-submit {
        width: 100%;
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.2s;
      }

      .btn-submit:hover {
        background-color: #1d4ed8;
      }

      /* Footer Note */
      .footer-note {
        text-align: center;
        margin-top: 25px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="brand-header">
        <div class="brand-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
            ></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <h1 class="brand-title">Login</h1>
        <p class="brand-subtitle">Sistem Pelacakan Palet Gudang</p>
      </div>

      {% if form.errors %}
      <div class="error-message">
        Akses ditolak. Silakan periksa kembali Nama Pengguna dan Sandi Anda.
        Huruf besar & kecil berpengaruh.
      </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input
          type="hidden"
          name="next"
          value="{{ next|default:'/scanner/' }}"
        />

        <div class="form-group">
          <label>ID Operator / Username</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input
              type="text"
              name="username"
              class="form-control"
              placeholder="Masukkan ID Anda"
              required
              autofocus
            />
          </div>
        </div>

        <div class="form-group">
          <label>Kata Sandi</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>

            <input
              type="password"
              name="password"
              id="password-input"
              class="form-control"
              style="padding-right: 45px"
              placeholder="••••••••"
              required
            />

            <span
              class="input-icon-right"
              id="toggle-btn"
              title="Tahan untuk melihat sandi"
            >
              <svg
                id="eye-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>

        <button type="submit" class="btn-submit">Login / Masuk</button>
      </form>

      <div class="footer-note">&copy; 2026 Sistem PDSU</div>
    </div>

    <script>
      const toggleBtn = document.getElementById("toggle-btn");
      const passwordInput = document.getElementById("password-input");
      const eyeIcon = document.getElementById("eye-icon");

      const svgEyeOpen =
        '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      const svgEyeClosed =
        '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

      function showPassword(e) {
        if (e) e.preventDefault();
        passwordInput.type = "text";
        eyeIcon.innerHTML = svgEyeClosed;
      }

      function hidePassword(e) {
        if (e) e.preventDefault();
        passwordInput.type = "password";
        eyeIcon.innerHTML = svgEyeOpen;
      }

      // Deteksi Laptop/PC
      toggleBtn.addEventListener("mousedown", showPassword);
      toggleBtn.addEventListener("mouseup", hidePassword);
      toggleBtn.addEventListener("mouseleave", hidePassword);

      // Deteksi HP/Touchscreen
      toggleBtn.addEventListener("touchstart", showPassword);
      toggleBtn.addEventListener("touchend", hidePassword);
      toggleBtn.addEventListener("touchcancel", hidePassword);
    </script>
  </body>
</html>
